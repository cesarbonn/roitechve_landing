# EJEMPLO — NO ES LA CONFIGURACIÓN ACTIVA DEL SERVIDOR
#
# Este archivo es una referencia de cómo podría verse el bloque de nginx para
# roitechve.com. No debe copiarse ni activarse sin antes:
#   1. Inspeccionar la configuración real de nginx en el VPS
#      (/etc/nginx/sites-available/, /etc/nginx/sites-enabled/,
#      /etc/nginx/conf.d/) para confirmar que no exista ya un server block
#      para este dominio ni conflictos con n8n.roitechve.com.
#   2. Confirmar las rutas reales de los certificados TLS (Let's Encrypt u
#      otro) y el método de renovación en uso.
#   3. Confirmar el nombre de host definitivo (roitechve.com, con o sin
#      "www", etc.) con el responsable del proyecto.
#   4. Hacer una copia de respaldo de cualquier archivo que se vaya a
#      modificar antes de tocarlo.
#
# Ajustar rutas de certificados, raíz del sitio y nombres de servidor según
# corresponda antes de usar este archivo como base real.

server {
    listen 80;
    listen [::]:80;
    server_name roitechve.com www.roitechve.com;

    # Redirección a HTTPS. Si el VPS usa certbot con el plugin de nginx,
    # este bloque suele generarse/ajustarse automáticamente.
    location / {
        return 301 https://$host$request_uri;
    }
}

# www.roitechve.com es solo un alias: redirige siempre al dominio canónico
# (roitechve.com) en HTTPS. No sirve contenido propio.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.roitechve.com;

    # AJUSTAR: puede reutilizar el mismo certificado que el bloque de abajo
    # si se emitió para ambos nombres (roitechve.com y www.roitechve.com).
    ssl_certificate     /etc/letsencrypt/live/roitechve.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roitechve.com/privkey.pem;

    return 301 https://roitechve.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name roitechve.com;

    # AJUSTAR: rutas reales de certificado según lo que exista en el VPS.
    ssl_certificate     /etc/letsencrypt/live/roitechve.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roitechve.com/privkey.pem;

    # AJUSTAR: ruta real donde se copiará el contenido de dist/ en el VPS.
    root /var/www/roitechve.com/html;
    index index.html;

    # El sitio es completamente estático: no hay backend ni proxy_pass aquí.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Cabeceras de seguridad básicas, opcionales y sin impacto en el
    # contenido estático.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/roitechve.com.access.log;
    error_log  /var/log/nginx/roitechve.com.error.log;
}

# Importante: n8n.roitechve.com usa un server block independiente
# (ya existente) que no debe modificarse ni duplicarse aquí.
